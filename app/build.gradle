plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.privacyavatartest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.local.privacyavatartest'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
    }
}
