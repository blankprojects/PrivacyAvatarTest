name: Feature request
description: Suggest a privacy-preserving improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What testing need is not currently covered?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Security constraints
      options:
        - label: The proposal does not require network access, telemetry, or persistence of sensitive data.
          required: true
